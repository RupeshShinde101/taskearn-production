<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KYC Review — Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
  .topbar{background:#1e293b;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .topbar h1{font-size:18px;font-weight:700}
  .topbar .stats{font-size:13px;color:#94a3b8}
  .container{max-width:1100px;margin:0 auto;padding:24px 16px}
  .filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
  .filter-bar select,.filter-bar input{padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;background:#fff}
  .filter-bar button{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600}
  .btn-refresh{background:#6366f1;color:#fff}
  .empty{text-align:center;padding:60px 20px;color:#94a3b8}
  .empty i{font-size:40px;margin-bottom:12px;display:block}
  .card{background:#fff;border-radius:12px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden;transition:box-shadow .2s}
  .card:hover{box-shadow:0 4px 16px rgba(0,0,0,.10)}
  .card-header{padding:16px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;border-bottom:1px solid transparent}
  .card-header.expanded{border-bottom:1px solid #f1f5f9}
  .avatar{width:42px;height:42px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#64748b;flex-shrink:0}
  .card-info{flex:1;min-width:0}
  .card-info .name{font-weight:600;font-size:15px}
  .card-info .meta{font-size:12px;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;flex-shrink:0}
  .badge.pending{background:#fef3c7;color:#d97706}
  .badge.rejected{background:#fee2e2;color:#dc2626}
  .badge.verified{background:#d1fae5;color:#059669}
  .card-body{padding:20px;display:none}
  .card-body.open{display:block}
  .section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-bottom:8px}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
  .info-item{background:#f8fafc;border-radius:8px;padding:10px 14px}
  .info-item .label{font-size:11px;color:#94a3b8;margin-bottom:3px}
  .info-item .value{font-size:14px;font-weight:600;word-break:break-all}
  .flag-box{background:#fef9c3;border:1px solid #fde68a;border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#92400e}
  .flag-box i{margin-right:6px;color:#d97706}
  .consent-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#166534}
  .consent-box i{margin-right:6px;color:#16a34a}
  .no-consent-box{background:#fff1f2;border:1px solid #fecdd3;border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#9f1239}
  .images{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
  .images figure{margin:0}
  .images figcaption{font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px}
  .images img{width:100%;border-radius:8px;border:1px solid #e2e8f0;object-fit:contain;max-height:220px;background:#f8fafc;cursor:zoom-in}
  .no-image{width:100%;height:120px;border-radius:8px;border:2px dashed #e2e8f0;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:13px}
  .actions{display:flex;gap:12px;flex-wrap:wrap}
  .actions button{padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
  .actions button:hover{opacity:.85}
  .btn-approve{background:#16a34a;color:#fff}
  .btn-reject{background:#dc2626;color:#fff}
  .btn-reject-reason{background:#f8fafc;color:#dc2626;border:1px solid #fecdd3 !important}
  .reject-form{margin-top:12px;display:none}
  .reject-form textarea{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;resize:vertical;min-height:70px}
  .reject-form button{margin-top:8px;padding:9px 20px;background:#dc2626;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
  .action-done{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;display:none}
  .action-done.approved{background:#d1fae5;color:#065f46}
  .action-done.rejected-ok{background:#fee2e2;color:#7f1d1d}
  /* lightbox */
  #lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center}
  #lb.show{display:flex}
  #lb img{max-width:92vw;max-height:92vh;border-radius:10px}
  #lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:28px;cursor:pointer;line-height:1}
  @media(max-width:600px){.images{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <h1><i class="fas fa-id-card" style="margin-right:8px;color:#818cf8"></i> KYC Review Panel</h1>
  <span class="stats" id="statsText">Loading…</span>
</div>

<div class="container">
  <div class="filter-bar">
    <select id="filterStatus" onchange="applyFilter()">
      <option value="">All pending &amp; rejected</option>
      <option value="pending" selected>Pending only</option>
      <option value="rejected">Rejected only</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search name / number…" oninput="applyFilter()">
    <button class="btn-refresh" onclick="loadSubmissions()"><i class="fas fa-sync-alt"></i> Refresh</button>
  </div>
  <div id="listContainer"><div class="empty"><i class="fas fa-spinner fa-spin"></i>Loading…</div></div>
</div>

<!-- Lightbox -->
<div id="lb" onclick="closeLightbox()">
  <span id="lb-close">&times;</span>
  <img id="lb-img" src="" alt="Document">
</div>

<script>
const API = '';  // same origin — backend serves this if opened from Railway, else set to your API URL
let allSubmissions = [];

function getToken() {
  return localStorage.getItem('taskearn_token') || sessionStorage.getItem('taskearn_token') || '';
}

function authHeaders() {
  return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' };
}

async function loadSubmissions() {
  document.getElementById('listContainer').innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading…</div>';
  try {
    const res = await fetch(API + '/api/admin/kyc/pending', { headers: authHeaders() });
    if (res.status === 401 || res.status === 403) {
      document.getElementById('listContainer').innerHTML = '<div class="empty"><i class="fas fa-lock"></i><br>Admin access required. Please log in as admin.</div>';
      return;
    }
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    allSubmissions = data.submissions || [];
    applyFilter();
  } catch (e) {
    document.getElementById('listContainer').innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle"></i><br>${e.message}</div>`;
  }
}

function applyFilter() {
  const status = document.getElementById('filterStatus').value;
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = allSubmissions;
  if (status) list = list.filter(s => s.status === status);
  if (q) list = list.filter(s =>
    (s.name || '').toLowerCase().includes(q) ||
    (s.documentNumber || '').toLowerCase().includes(q) ||
    (s.phone || '').includes(q)
  );
  const pending = allSubmissions.filter(s => s.status === 'pending').length;
  document.getElementById('statsText').textContent = `${pending} pending · ${allSubmissions.length} total`;
  renderList(list);
}

function renderList(list) {
  if (!list.length) {
    document.getElementById('listContainer').innerHTML = '<div class="empty"><i class="fas fa-check-double"></i><br>No submissions found</div>';
    return;
  }
  document.getElementById('listContainer').innerHTML = list.map(s => cardHTML(s)).join('');
}

function initials(name) {
  return (name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function docLabel(t) {
  return { aadhaar: 'Aadhaar', pan: 'PAN Card', voter_id: 'Voter ID', driving_license: 'Driving Licence' }[t] || (t || '—').toUpperCase();
}

function cardHTML(s) {
  const uid = s.userId;
  const badgeCls = s.status === 'pending' ? 'pending' : 'rejected';
  const badgeTxt = s.status === 'pending' ? '⏳ Pending' : '❌ Rejected';
  return `
  <div class="card" id="card-${uid}">
    <div class="card-header" onclick="toggleCard('${uid}')">
      <div class="avatar">${initials(s.name)}</div>
      <div class="card-info">
        <div class="name">${escHtml(s.name || 'Unknown')}</div>
        <div class="meta">${escHtml(s.phone || s.email || '')} · ${docLabel(s.documentType)} · submitted ${fmtDate(s.acknowledgedAt)}</div>
      </div>
      <span class="badge ${badgeCls}">${badgeTxt}</span>
      <i class="fas fa-chevron-down" id="chevron-${uid}" style="margin-left:10px;color:#94a3b8;transition:transform .2s"></i>
    </div>
    <div class="card-body" id="body-${uid}">
      <div id="detail-${uid}"><div style="color:#94a3b8;font-size:13px;padding:10px 0"><i class="fas fa-spinner fa-spin"></i> Loading details…</div></div>
    </div>
  </div>`;
}

async function toggleCard(uid) {
  const body = document.getElementById('body-' + uid);
  const chevron = document.getElementById('chevron-' + uid);
  const header = body.previousElementSibling;
  if (body.classList.contains('open')) {
    body.classList.remove('open');
    header.classList.remove('expanded');
    chevron.style.transform = '';
    return;
  }
  body.classList.add('open');
  header.classList.add('expanded');
  chevron.style.transform = 'rotate(180deg)';
  await loadDetail(uid);
}

async function loadDetail(uid) {
  const el = document.getElementById('detail-' + uid);
  if (el.dataset.loaded) return;
  try {
    const res = await fetch(API + '/api/admin/user/' + uid + '/kyc', { headers: authHeaders() });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    const u = data.user;
    el.innerHTML = detailHTML(uid, u);
    el.dataset.loaded = '1';
  } catch (e) {
    el.innerHTML = `<div style="color:#dc2626;font-size:13px">Failed to load: ${e.message}</div>`;
  }
}

function detailHTML(uid, u) {
  const consentHtml = u.acknowledgedAt
    ? `<div class="consent-box"><i class="fas fa-check-circle"></i> User accepted legal declaration on <strong>${fmtDate(u.acknowledgedAt)}</strong></div>`
    : `<div class="no-consent-box"><i class="fas fa-exclamation-triangle"></i> No consent recorded — submission may predate this feature</div>`;

  const flagHtml = u.flagReason
    ? `<div class="flag-box"><i class="fas fa-flag"></i><strong>Flag:</strong> ${escHtml(u.flagReason)}</div>`
    : '';

  const frontImg = u.documentImageFront
    ? `<img src="${u.documentImageFront}" alt="Front" onclick="openLightbox('${uid}-front')" loading="lazy">`
    : `<div class="no-image"><i class="fas fa-image"></i>&nbsp;No front image</div>`;

  const backImg = u.documentImageBack
    ? `<img src="${u.documentImageBack}" alt="Back" onclick="openLightbox('${uid}-back')" loading="lazy">`
    : `<div class="no-image"><i class="fas fa-image"></i>&nbsp;No back image</div>`;

  // Store images for lightbox
  window._lbImages = window._lbImages || {};
  if (u.documentImageFront) window._lbImages[uid + '-front'] = u.documentImageFront;
  if (u.documentImageBack) window._lbImages[uid + '-back'] = u.documentImageBack;

  return `
    ${consentHtml}
    ${flagHtml}
    <div class="section-label">Document Info</div>
    <div class="info-grid">
      <div class="info-item"><div class="label">Full Name</div><div class="value">${escHtml(u.name || '—')}</div></div>
      <div class="info-item"><div class="label">Email</div><div class="value">${escHtml(u.email || '—')}</div></div>
      <div class="info-item"><div class="label">Document Type</div><div class="value">${docLabel(u.documentType)}</div></div>
      <div class="info-item"><div class="label">Entered Number</div><div class="value" style="font-family:monospace">${escHtml(u.documentNumber || '—')}</div></div>
      <div class="info-item"><div class="label">Status</div><div class="value">${escHtml(u.kycStatus || '—')}</div></div>
      <div class="info-item"><div class="label">Verified On</div><div class="value">${fmtDate(u.verifiedAt)}</div></div>
    </div>
    <div class="section-label">Document Images <span style="font-weight:400;color:#94a3b8">(click to zoom)</span></div>
    <div class="images">
      <figure><figcaption>Front Side</figcaption>${frontImg}</figure>
      <figure><figcaption>Back Side</figcaption>${backImg}</figure>
    </div>
    <div class="section-label">Actions</div>
    <div class="actions">
      <button class="btn-approve" onclick="doAction('${uid}','approve')"><i class="fas fa-check"></i> Approve</button>
      <button class="btn-reject-reason" onclick="toggleRejectForm('${uid}')"><i class="fas fa-times"></i> Reject…</button>
    </div>
    <div class="reject-form" id="rform-${uid}">
      <textarea id="rreason-${uid}" placeholder="Reason for rejection (shown to user)…"></textarea>
      <button onclick="doAction('${uid}','reject')"><i class="fas fa-paper-plane"></i> Send Rejection</button>
    </div>
    <div class="action-done" id="adone-${uid}"></div>`;
}

function toggleRejectForm(uid) {
  const f = document.getElementById('rform-' + uid);
  f.style.display = f.style.display === 'block' ? 'none' : 'block';
}

async function doAction(uid, action) {
  const reason = action === 'reject' ? (document.getElementById('rreason-' + uid)?.value?.trim() || '') : '';
  const doneEl = document.getElementById('adone-' + uid);
  try {
    const res = await fetch(API + '/api/admin/kyc/' + uid + '/verify', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ action, reason })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    doneEl.textContent = action === 'approve' ? '✅ Approved — user notified' : '❌ Rejected — user notified';
    doneEl.className = 'action-done ' + (action === 'approve' ? 'approved' : 'rejected-ok');
    doneEl.style.display = 'block';
    // Update badge in list header
    const badge = document.querySelector(`#card-${uid} .badge`);
    if (badge) {
      badge.textContent = action === 'approve' ? '✅ Approved' : '❌ Rejected';
      badge.className = 'badge ' + (action === 'approve' ? 'verified' : 'rejected');
    }
    // Remove from allSubmissions pending count
    const s = allSubmissions.find(x => String(x.userId) === String(uid));
    if (s) s.status = action === 'approve' ? 'verified' : 'rejected';
    const pending = allSubmissions.filter(s => s.status === 'pending').length;
    document.getElementById('statsText').textContent = `${pending} pending · ${allSubmissions.length} total`;
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

function openLightbox(key) {
  const src = (window._lbImages || {})[key];
  if (!src) return;
  document.getElementById('lb-img').src = src;
  document.getElementById('lb').classList.add('show');
}
function closeLightbox() { document.getElementById('lb').classList.remove('show'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Auto-set filter to pending on load
document.getElementById('filterStatus').value = 'pending';
loadSubmissions();
</script>
</body>
</html>
